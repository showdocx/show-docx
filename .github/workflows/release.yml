name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Validate tag and package version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npx playwright install --with-deps chromium
      # npm run package triggers vscode:prepublish, which runs verify.
      - run: xvfb-run -a npm run package

      - name: Generate checksum
        shell: bash
        run: sha256sum "show-docx-${VERSION}.vsix" > "show-docx-${VERSION}.vsix.sha256"

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          generate_release_notes: true
          files: |
            show-docx-${{ env.VERSION }}.vsix
            show-docx-${{ env.VERSION }}.vsix.sha256
