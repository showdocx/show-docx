name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Core checks (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run check-types
      - run: npm run test:unit

      - name: Extension Host tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Extension Host tests in Restricted Mode (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:restricted

      # engines promises ^1.85.0, so the oldest release it promises is tested too.
      - name: Extension Host tests on VS Code 1.85.0 (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration:minimum

      - name: Extension Host tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:integration

      - name: Extension Host tests (macOS)
        if: runner.os == 'macOS'
        run: npm run test:integration

  webview-and-package:
    name: Webview and VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # Dev dependencies never reach the VSIX: the extension bundles with esbuild
      # and packages with --no-dependencies. Gate on what ships, at a severity
      # worth blocking a release for.
      - run: npm audit --audit-level=high --omit=dev
      - run: npx playwright install --with-deps chromium
      # vsce runs vscode:prepublish, which runs the full verify suite — including
      # the Extension Host tests, hence xvfb.
      - run: xvfb-run -a npm run package

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: show-docx-vsix
          path: show-docx-*.vsix
          if-no-files-found: error
          retention-days: 14
